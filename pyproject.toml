[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xeno-discovery"
version = "0.1.0"
description = "Headless, explicitly synthetic astrobiology investigation prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "httpx2>=2.16.0",
  "h5py>=3.12,<4",
]

[project.scripts]
xeno = "xeno.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["xeno"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["unreal", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
